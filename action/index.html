<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>定时操作确认</title>
    <style>
      /* 内联兜底样式：JS 加载前先渲染出和最终 UI 一致的静态界面，避免白屏 */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { width: 100%; height: 100%; }
      body {
        font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        background: #fff; overflow: hidden; user-select: none;
      }
      .confirm-window {
        width: 100vw; height: 100vh;
        display: flex; flex-direction: column; background: #fff;
      }
      .titlebar {
        height: 38px; flex-shrink: 0; padding-left: 16px;
        display: flex; align-items: center; justify-content: space-between;
        background: linear-gradient(135deg, #2c3e50, #34495e); color: #fff;
      }
      .titlebar .title { font-size: 13px; font-weight: bold; }
      .tb-close {
        width: 46px; height: 100%; border: none; background: transparent;
        color: rgba(255,255,255,.85); font-size: 12px; cursor: default;
      }
      .content {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        font-size: 17px; font-weight: bold; color: #2c3e50; text-align: center;
      }
      .countdown {
        font-size: 48px; color: #e74c3c; margin: 4px 0;
        font-variant-numeric: tabular-nums;
      }
      .buttons {
        display: flex; justify-content: center; gap: 12px; padding: 0 16px 16px;
      }
      .btn {
        min-width: 120px; padding: 9px 16px; border: none; border-radius: 5px;
        font-size: 14px; font-weight: bold; color: #fff;
      }
      .btn-danger { background: #eb4444; }
      .btn-success { background: #4caf50; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- 静态兜底：React 挂载前直接渲染，避免白屏。挂载后被替换 -->
      <div class="confirm-window">
        <div class="titlebar">
          <span class="title" id="fallback-title">定时关机</span>
          <button class="tb-close">✕</button>
        </div>
        <div class="content">
          <div>系统将在</div>
          <div class="countdown">60</div>
          <div id="fallback-action">秒后 关机...</div>
        </div>
        <div class="buttons">
          <button class="btn btn-danger" id="fallback-execute">立即关机</button>
          <button class="btn btn-success">取消</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
